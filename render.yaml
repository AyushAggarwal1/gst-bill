services:
  # Main web service
  - type: web
    name: gst-bill-app
    env: node
    plan: starter
    buildCommand: npm ci && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false # Create this environment variable in the Render dashboard
      - key: NEXTAUTH_SECRET 
        generateValue: true # This will generate a random value for the secret
      - key: NEXTAUTH_URL
        fromService:
          name: gst-bill-app
          type: web
          property: url 